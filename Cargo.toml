[package]
name = "vellum"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Read YouTube videos: a native transcript reader with local speech recognition"
license = "MIT"
repository = "https://github.com/IfkumRfnl/vellum"
readme = "README.md"
keywords = ["youtube", "transcript", "speech-to-text", "whisper", "reader"]
categories = ["multimedia::audio", "gui"]
# Rune and its patched dependencies come from Git, so the app isn't published to crates.io.
publish = false

[dependencies]
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d", default-features = false }
rune = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
directories = "6"
anyhow = "1"
html-escape = "0.2"
url = "2"
ureq = { version = "2.12", features = ["json"] }
hound = "3.5"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"] }
libloading = "0.8"

[target.'cfg(not(windows))'.dependencies]
sherpa-onnx = "=1.13.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "=0.4.2", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
transcribe-cpp = { version = "=0.4.2", default-features = false, features = ["vulkan", "dynamic-backends"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
debug = 0

# Rune patches these crates in its own workspace. Cargo applies patches only from the root
# manifest, so an app that depends on Rune repeats them here at the same revision.
[patch.crates-io]
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
winit = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "63ad0209edc9a3a7d2208b7f6c66f9e353da315d" }
