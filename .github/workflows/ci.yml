# Formatting, lints and the offline tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check

      # Compiled dependencies, saved from main.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # What Vellum's Linux dependencies link: xkbcommon, fontconfig and Wayland (X11 and
      # Vulkan load at run time).
      - name: Install Linux libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      # The speech engine, its harness and the lab (crates/lab/README.md). The reference
      # adapter builds transcribe.cpp from C++, so it stays out: the lab builds it on demand.
      - name: Lint the engine and the lab
        run: cargo clippy --locked --workspace --exclude vellum-ref --all-targets -- -D warnings
      # The engine's SIMD is x86 only; ARM (macOS, Windows on ARM) takes the portable code.
      - name: Lint the engine for ARM
        run: |
          rustup target add aarch64-apple-darwin
          cargo clippy --locked -p vellum-engine -p vellum-harness --target aarch64-apple-darwin -- -D warnings
