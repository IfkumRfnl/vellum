# Formatting, lints and the offline tests on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check

      # Compiled dependencies, sherpa-onnx's download and the built speech engine, shared
      # with the Linux x64 release build (see release.yml).
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Find the native libraries' versions
        run: |
          version() { grep -A1 "^name = \"$1\"$" Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p'; }
          echo "SHERPA_KEY=sherpa-linux-x64-$(version sherpa-onnx-sys)" >> "$GITHUB_ENV"
          echo "ENGINE_KEY=transcribe-linux-x64-$(version transcribe-cpp-sys)-v1" >> "$GITHUB_ENV"
      - name: Restore sherpa-onnx's download
        id: sherpa
        uses: actions/cache@v4
        with:
          path: target/sherpa-onnx-prebuilt
          key: ${{ env.SHERPA_KEY }}
      # Without it, sherpa-onnx's build script must run again to fetch it.
      - name: Fetch sherpa-onnx again
        if: steps.sherpa.outputs.cache-hit != 'true'
        run: cargo clean -p sherpa-onnx-sys
      - name: Restore the speech engine
        id: engine
        uses: actions/cache/restore@v4
        with:
          path: .native/transcribe
          key: ${{ env.ENGINE_KEY }}
      - name: Use the restored speech engine
        if: steps.engine.outputs.cache-hit == 'true'
        run: echo "TRANSCRIBE_DIR=${{ github.workspace }}/.native/transcribe" >> "$GITHUB_ENV"

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake pkg-config libasound2-dev libssl-dev libgtk-3-dev \
            libxkbcommon-x11-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev \
            libxcursor-dev libxi-dev libxrandr-dev libwayland-dev libvulkan-dev glslc libshaderc-dev
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

      - name: Keep the speech engine
        if: steps.engine.outputs.cache-hit != 'true'
        run: |
          manifest="$(find target -path '*transcribe-cpp-sys*' -name transcribe-link.json | head -1)"
          prefix="$(dirname "$(dirname "$manifest")")"
          mkdir -p .native/transcribe
          for part in bin include lib lib64 share; do
            if [ -e "$prefix/$part" ]; then cp -a "$prefix/$part" .native/transcribe/; fi
          done
          rm -rf "$prefix/build"
      - name: Save the speech engine
        if: steps.engine.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .native/transcribe
          key: ${{ env.ENGINE_KEY }}
