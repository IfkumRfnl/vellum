# Builds Vellum for every desktop. For a version tag (v0.1.0) it publishes a GitHub Release
# with the archives attached. Run it by hand on main to try the builds, which also refreshes
# the build caches the next release starts from.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            label: windows-x64
          - name: Windows ARM64
            runner: windows-11-arm
            label: windows-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            label: linux-x64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            label: linux-arm64
          - name: macOS Apple Silicon
            runner: macos-15
            label: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            label: macos-x64
    steps:
      - uses: actions/checkout@v5

      - name: Name the release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version="${GITHUB_REF_NAME#v}"; else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=vellum-$version-${{ matrix.label }}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      # Compiled Rust dependencies, saved from main only: a cache saved by a tag build is
      # visible to that tag alone.
      # Windows keys on the runner image too: its C toolset changes with it, and objects
      # built by a newer toolset don't link with an older one.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}
          env-vars: ${{ runner.os == 'Windows' && 'CARGO CC CFLAGS RUST INCLUDE LIB ImageVersion' || 'CARGO CC CFLAGS RUST' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The C parts of Rust dependencies (ring, BLAKE3, psm) build with clang-cl on Windows ARM64.
      - name: Use clang-cl
        if: matrix.label == 'windows-arm64'
        shell: bash
        run: echo "CC=clang-cl" >> "$GITHUB_ENV"

      # What Vellum's Linux dependencies link: xkbcommon, fontconfig and Wayland (X11 and
      # Vulkan load at run time).
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libwayland-dev

      - name: Build
        run: cargo build --release --locked

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/$env:ARCHIVE"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/vellum.exe, LICENSE, THIRD_PARTY_NOTICES.md $dir
          Get-ChildItem $dir | Format-Table Name, Length
          Compress-Archive -Path $dir -DestinationPath "dist/$env:ARCHIVE.zip"

      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          dir="dist/$ARCHIVE"
          mkdir -p "$dir"
          cp target/release/vellum LICENSE THIRD_PARTY_NOTICES.md "$dir/"
          ls -la "$dir"
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"

      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          app="dist/Vellum.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/vellum "$app/Contents/MacOS/"
          iconset="$RUNNER_TEMP/Vellum.iconset"
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            sips -z $size $size assets/app-icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
            sips -z $((size * 2)) $((size * 2)) assets/app-icon.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Vellum.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Vellum</string>
            <key>CFBundleDisplayName</key><string>Vellum</string>
            <key>CFBundleIdentifier</key><string>app.vellum.reader</string>
            <key>CFBundleExecutable</key><string>vellum</string>
            <key>CFBundleIconFile</key><string>Vellum</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep --sign - "$app"
          cp LICENSE THIRD_PARTY_NOTICES.md dist/
          (cd dist && ditto -c -k --keepParent Vellum.app "$ARCHIVE.zip")

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The release's notes are its section of CHANGELOG.md, then which download is whose.
      - name: Write the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/vellum-$version"
          cat >> notes.md <<NOTES

          ### Downloads

          | System | Download |
          | --- | --- |
          | Windows x64 | [vellum-$version-windows-x64.zip]($base-windows-x64.zip) |
          | Windows ARM64 | [vellum-$version-windows-arm64.zip]($base-windows-arm64.zip) |
          | macOS Apple Silicon | [vellum-$version-macos-arm64.zip]($base-macos-arm64.zip) |
          | macOS Intel | [vellum-$version-macos-x64.zip]($base-macos-x64.zip) |
          | Linux x64 | [vellum-$version-linux-x64.tar.gz]($base-linux-x64.tar.gz) |
          | Linux ARM64 | [vellum-$version-linux-arm64.tar.gz]($base-linux-arm64.tar.gz) |

          Vellum also needs [yt-dlp](https://github.com/yt-dlp/yt-dlp/releases) with Node.js 22+ or Deno, and [FFmpeg](https://ffmpeg.org/download.html). The Mac app isn't notarized: the first time, right-click it and choose **Open**.
          NOTES
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Vellum ${{ github.ref_name }}
          files: dist/*
          body_path: notes.md
