[package]
name = "vellum-lab"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "The engine lab: Vellum's engine against transcribe.cpp on a corpus, for speed and correctness"
license = "MIT"
publish = false

[[bin]]
name = "lab"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
claxon = "0.4"
directories = "6"
flate2 = "1"
hound = "3.5"
# Entities in the BBC scripts and podcast transcripts the YouTube cases are scored against.
html-escape = "0.2"
# GPU clocks, temperature and power during runs; loads nvml.dll at run time.
nvml-wrapper = "0.13"
# Transcript normalization for scoring (Whisper's normalizers are regex-based).
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
unicode-normalization = "0.1"
ureq = { version = "2.12", features = ["json"] }
vellum-engine = { path = "../engine" }
vellum-harness = { path = "../harness" }

# The machine description: OS, CPU, memory, power and the GPUs DXGI sees.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading"] }
