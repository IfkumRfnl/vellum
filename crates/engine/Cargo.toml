[package]
name = "vellum-engine"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Vellum's speech engine in Rust: Parakeet, Whisper and Sortformer from GGUF files"
license = "MIT"
publish = false

[dependencies]
half = "2.7"
memmap2 = "0.9"
# Whisper's compression-ratio test deflates as the reference's miniz does (a port of it).
miniz_oxide = "0.8"
rayon = "1"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# The GPU path (`gpu`): the engine's own device, compute shaders in WGSL. The same wgpu as the
# app (whose root manifest patches wgpu-hal with Rune's fork, which enables cooperative
# matrices on Vulkan), with only the backends a compute engine needs.
wgpu = { version = "30.0.2", default-features = false, features = ["std", "parking_lot", "wgsl"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["vulkan"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["dx12"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0.2", default-features = false, features = ["metal"] }
