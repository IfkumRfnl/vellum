[package]
name = "vellum-harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "The job protocol and runner both engines share in the engine lab, so they're measured alike"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
claxon = "0.4"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
